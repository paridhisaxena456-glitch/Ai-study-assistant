<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">🤖 AI Study Assistant</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Study Tools</a>
            <a href="#">About</a>
        </div>
    </nav>

    <section class="hero">

        <h1>AI Study Assistant</h1>

        <p>
            Your smart companion for learning, studying and solving questions.
        </p>

        <div class="assistant-box">

            <h2>Ask Your Study Question</h2>

            <input
                type="text"
                id="question"
                placeholder="Enter your question..."
            >

            <button onclick="askAI()">Ask AI</button>

            <div id="answer"></div>

        </div>

    </section>

    <footer>
        <p>© 2026 AI Study Assistant | Student Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
